<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniShop - Đăng ký</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="brand" href="index.html">MiniShop</a>
            <p>Cửa hàng công nghệ dành cho sinh viên</p>
            <nav class="main-nav" aria-label="Điều hướng chính">
                <a href="index.html">Trang chủ</a>
                <a href="about.html">Giới thiệu</a>
                <a href="product.html">Sản phẩm</a>
                <a class="active" aria-current="page" href="register.html">Đăng ký</a>
                <a href="login.html">Đăng nhập</a>
                <a href="cart.html">Giỏ hàng (<span class="cart-count">0</span>)</a>
                <a href="contact.html">Liên hệ</a>
            </nav>
        </div>
    </header>
    <main class="container page-content">
        <h1>Đăng ký thành viên</h1>
        <form class="form-panel" data-validate="register">
            <label for="name">Họ và tên</label>
            <input type="text" id="name" name="name" required>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" minlength="6" required>
            <label for="phone">Số điện thoại</label>
            <input type="tel" id="phone" name="phone">
            <label for="category">Sản phẩm quan tâm</label>
            <select id="category" name="category">
                <option>Laptop</option>
                <option>Chuột</option>
                <option>Bàn phím</option>
                <option>Tai nghe</option>
            </select>
            <button class="button" type="submit">Đăng ký</button>
            <p class="form-message" aria-live="polite"></p>
        </form>
    </main>
    <footer class="site-footer">
        <div class="container">
            <p><strong>MiniShop</strong> - Cửa hàng công nghệ dành cho sinh viên</p>
            <p>Email: minishop@gmail.com | Hotline: 0123 456 789</p>
        </div>
    </footer>
</body>
</html>
